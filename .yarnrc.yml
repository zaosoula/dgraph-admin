nodeLinker: node-modules
enableGlobalCache: false

# The cache in .yarn/cache is committed (see .gitignore), and the Docker image
# and CI both build on linux/amd64 while development happens on macOS. Without
# this, installing on one platform prunes the other's native binaries from the
# cache and committing that breaks the build for everyone else.
supportedArchitectures:
  os:
    - darwin
    - linux
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl

preferInteractive: true

tsEnableAutoTypes: true
